plugin.name=Glass Islands

settings.enable=Enable Glass Islands
settings.contrast=Island contrast:
settings.contrast.raised=Raised: light islands on a darker window
settings.contrast.inverted=Inverted: dark islands in a lighter window
settings.opacity=Opacity:
settings.opacity.comment=Tool windows use this opacity; the editor is always a step more opaque, the window a step lighter.
settings.editor=Editor on glass
settings.editor.comment=Off keeps the editor fully opaque, still drawn as a rounded island.
settings.controls=Glass buttons and tabs
settings.controls.comment=Selected and hovered toolbar buttons, tool window buttons and editor tabs become Liquid Glass pills.
settings.reset=Reset to Defaults
settings.flicker=Flicker-free rendering
settings.flicker.active=Active: Rider presents each frame once it is complete, so nothing on the glass blinks.
settings.flicker.restart=Applies at the next start of Rider (one-time restart).
settings.flicker.inactive=Off: Rider presents frames from the display refresh and may show a panel blank for one frame. Uses -Dsun.java2d.metal.displaySync=false in your custom VM options, removed with the plugin.
settings.status.active=Active: frosted islands and {0} on macOS {1}.
settings.status.active.glass=Liquid Glass buttons and tabs
settings.status.active.frosted=frosted buttons and tabs (Liquid Glass needs macOS 26)
settings.status.disabled=Off: Rider keeps its regular opaque look.
settings.status.paused=Paused: {0}.
settings.status.contrast=Increase contrast is on in macOS: every layer is more opaque and outlined.

action.GlassIslands.Toggle.text=Glass Islands
action.GlassIslands.Toggle.description=Turn the translucent Glass Islands look of Rider on or off
action.GlassIslands.DebugInformation.text=Glass Islands Debug Information
action.GlassIslands.DebugInformation.description=Write the native bridge, window and material diagnostics of Glass Islands next to idea.log and open them


notification.safe.mode.title=Glass Islands was turned off
notification.safe.mode.content=Rider stopped while Glass Islands was being applied, so it stays off to keep Rider safe. You can turn it back on at any time.
notification.safe.mode.enable=Turn Back On
notification.open.settings=Settings
notification.group.setup=Glass Islands setup
notification.flicker.title=Restart once for flicker-free glass
notification.flicker.content=Glass Islands set Rider to present each frame once it is complete, which removes the blinking of the translucent window while redrawing. Rider reads this setting when it starts.
notification.flicker.restart=Restart Now
notification.flicker.later=Later

pause.theme.no.islands=the current theme has no islands; choose Islands Dark, Islands Light or Islands Darcula
pause.theme.high.contrast=the High Contrast theme is designed to stay fully opaque
